name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: predelinq
          POSTGRES_PASSWORD: predelinq
          POSTGRES_DB: predelinq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predelinq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check src/ tests/
          python -m black --check src/ tests/

      - name: Test
        env:
          DATABASE_URL: "postgresql+psycopg2://predelinq:predelinq@localhost:5432/predelinq"
          PREDELINQ_CONFIG: config.yaml
        run: python -m pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t predeliquency:ci .
