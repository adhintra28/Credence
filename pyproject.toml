[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predeliquency"
version = "0.2.0"
description = "Pre-Delinquency Early Warning Engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2",
    "pyarrow>=14,<18",
    "scikit-learn>=1.3,<2",
    "lightgbm>=4.1,<5",
    "xgboost>=2.0,<3",
    "shap>=0.43,<1",
    "pyyaml>=6,<7",
    "python-dateutil>=2.8,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.25,<1",
    "flask>=3.0,<4",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "slowapi>=0.1,<1",
    "python-multipart>=0.0.6",
    "structlog>=24.1,<25",
    "prometheus-client>=0.20,<1",
    "mlflow>=2.10,<3",
    "wtforms>=3.1,<4",
    "flask-wtf>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4,<6",
    "pytest-xdist>=3,<4",
    "httpx>=0.25,<1",
    "ruff>=0.2,<1",
    "black>=24,<25",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]
