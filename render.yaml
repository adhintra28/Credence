# Render blueprint — one-command deploy for the Credence portal.
#   Render dashboard -> New -> Blueprint -> this repo (or: push to GitHub and
#   pick "Blueprints" -> "New Blueprint").
services:
  - type: web
    name: credence-predelinquency
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT frontend.app:app
    envVars:
      - key: PREDELINQ_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # Google SSO — set in the Render dashboard (see docs/SSO_SETUP.md)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
    healthCheckPath: /healthz
