<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pre-Delinquency Engine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #0d0f14;
      --bg-card: #13161e;
      --bg-card-hover: #1a1e2a;
      --bg-row-hover: #1c2030;
      --border: #ffffff12;
      --border-light: #ffffff0a;
      --accent: #00aeef;
      --accent-dim: #00aeef1f;
      --text-primary: #e8eaf0;
      --text-secondary: #8b90a0;
      --text-muted: #545870;
      
      --green: #00c97a;
      --green-dim: #00c97a1a;
      --green-border: #00c97a33;
      
      --red: #ff6b6b;
      --red-dim: #ff4d4d1a;
      --red-border: #ff4d4d33;
      
      --amber: #fbbf24;
      --amber-dim: #f59e0b1a;
      --amber-border: #f59e0b33;

      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 24px #0006;
      
      --font-body: 'DM Sans', sans-serif;
      --font-display: 'Syne', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top nav ── */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
    }
    .top-brand .badge {
      font-family: var(--font-body);
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .top-brand .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .top-right a {
      color: var(--text-primary);
      text-decoration: none;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all .2s;
      background: transparent;
    }
    .top-right a:hover { 
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    /* ── Layout ── */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 36px 40px; }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
    }

    /* ── Buttons ── */
    .btn {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: opacity .2s, transform .15s;
      display: inline-block;
      text-decoration: none;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn.ghost:hover { 
      background: var(--accent-dim); 
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.green { background: var(--green); color: #0d0f14; }
    .btn.red   { background: var(--red); color: #0d0f14; }

    /* ── Tables ── */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { 
      background: rgba(0,0,0,0.2); 
      border-bottom: 1px solid var(--border);
      color: var(--text-muted); 
      font-size: 11px; 
      font-weight: 600; 
      letter-spacing: .7px; 
      padding: 12px 16px; 
      text-align: left; 
      text-transform: uppercase; 
      white-space: nowrap;
    }
    td {
      border-bottom: 1px solid var(--border-light);
      padding: 13px 16px;
      vertical-align: middle;
      font-size: 13px;
    }
    tr { transition: background .15s; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-row-hover); }

    /* ── Tier badges ── */
    .tier-Red   { background: var(--red-dim); border: 1px solid var(--red-border); color: var(--red); font-weight: 600; padding: 4px 10px; border-radius: 20px; font-size: 11px; letter-spacing: 0.3px; display: inline-block; }
    .tier-Amber { background: var(--amber-dim); border: 1px solid var(--amber-border); color: var(--amber); font-weight: 600; padding: 4px 10px; border-radius: 20px; font-size: 11px; letter-spacing: 0.3px; display: inline-block; }
    .tier-Green { background: var(--green-dim); border: 1px solid var(--green-border); color: var(--green); font-weight: 600; padding: 4px 10px; border-radius: 20px; font-size: 11px; letter-spacing: 0.3px; display: inline-block; }

    /* ── KPIs ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .kpi {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .kpi:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }
    .kpi b { 
      font-family: var(--font-display); 
      font-size: 32px; 
      font-weight: 700;
      line-height: 1;
      color: var(--text-primary);
    }
    .kpi small { 
      color: var(--text-secondary); 
      font-size: 12px; 
      letter-spacing: .6px; 
      text-transform: uppercase;
    }

    /* ── Nav strip ── */
    .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
    .nav a {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 12px;
      padding: 7px 14px;
      transition: all .18s;
      text-decoration: none;
    }
    .nav a:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }
    .nav a.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    /* ── Typography headers ── */
    h2 { 
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 6px; 
    }
    h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.2px; }
    .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0; }
    
    /* ── Form elements ── */
    input, select, textarea {
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-family: var(--font-body);
      font-size: 13px;
      width: 100%;
      transition: border-color .2s;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--bg-card); }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }

    /* ── Alerts ── */
    .msg { background: var(--green-dim); border: 1px solid var(--green-border); color: var(--green); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }
    .err { background: var(--red-dim); border: 1px solid var(--red-border); color: var(--red); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }

    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    code { font-family: Courier New, monospace; font-size: 11px; letter-spacing: 0.5px; color: var(--text-muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="top">
  <div class="top-brand">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    </div>
    Pre-Delinquency Engine
    <span class="badge">PROD</span>
  </div>
  <div class="top-right">
    {% if session.get('email') %}
      <span>{{ session.email }} · <strong style="color:var(--text-primary)">{{ session.role }}</strong>{% if session.get('bank') %} @ {{ session.bank }}{% endif %}</span>
      <a href="/logout">Logout</a>
    {% endif %}
  </div>
</div>
<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
