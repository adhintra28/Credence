{% extends "base.html" %}{% block title %}Access Denied{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card" style="text-align:center;border-color:var(--red-border)">
    <div class="mark" style="width:44px;height:44px;border-radius:8px;background:var(--red-dim);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-family:var(--mono);font-weight:700;font-size:16px">!</div>
    <h1>Access Denied</h1>
    <p class="subtitle" style="margin-top:4px">Authorization failed</p>
    <div class="err" style="text-align:left;margin-top:22px;margin-bottom:24px">{{ msg }}</div>
    <a href="/" class="btn">← Back to Login</a>
  </div>
</div>
{% endblock %}
