{% extends "base.html" %}{% block title %}Bank Employee Login{% endblock %}{% block body %}
<div class="card" style="max-width:440px;margin:40px auto">
  <h2>🏦 Bank Employee Portal</h2>
  <p>Select your institution to continue with Google SSO.</p>

  <form method="post" action="/login/bank">
    <select name="bank_id" required style="width:100%;padding:10px;margin:12px 0;font-size:15px;border-radius:5px;border:1px solid #ccc">
      <option value="" disabled selected>Select your Bank...</option>
      {% for bank_id, info in banks.items() %}
        <option value="{{ bank_id }}">{{ info.name }}</option>
      {% endfor %}
    </select>
    <br>
    <button class="btn" style="width:100%;padding:12px;background:#4285F4;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer">
      Login with Google
    </button>
  </form>

  <p style="margin-top:16px;text-align:center">
    <small>⚠️ Your email must match your institution's domain to proceed.</small>
  </p>
  <p style="text-align:center"><a href="/">← Back</a></p>
</div>
{% endblock %}
